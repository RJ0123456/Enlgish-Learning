<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f4ef" />
  <title>English Learning Hub · 英语学习导航</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-color: #f5f4ef;
      --card-bg: #ffffff;
      --text-main: #1f2421;
      --text-muted: #6e736f;
      --accent-article: #2b5c46;
      --accent-article-light: #e8f2ed;
      --accent-dialog: #3b5998;
      --accent-dialog-light: #ebf0f9;
      --border-color: #e4e2d9;
      --shadow-sm: 0 4px 20px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.08);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }

    .container {
      max-width: 900px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 3.5rem;
    }

    header .badge {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.04);
      padding: 0.4rem 1rem;
      border-radius: 999px;
      margin-bottom: 1rem;
    }

    header h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 2.75rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
      margin-bottom: 0.75rem;
    }

    header p {
      font-size: 1.1rem;
      color: var(--text-muted);
    }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
    }

    .nav-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 2.25rem 2rem;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow-sm);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .nav-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-lg);
      border-color: transparent;
    }

    .nav-card.article:hover {
      border-color: var(--accent-article);
    }

    .nav-card.dialog:hover {
      border-color: var(--accent-dialog);
    }

    .card-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      margin-bottom: 1.5rem;
    }

    .article .card-icon {
      background: var(--accent-article-light);
      color: var(--accent-article);
    }

    .dialog .card-icon {
      background: var(--accent-dialog-light);
      color: var(--accent-dialog);
    }

    .card-title {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 1.65rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-subtitle {
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }

    .article .card-subtitle {
      color: var(--accent-article);
    }

    .dialog .card-subtitle {
      color: var(--accent-dialog);
    }

    .card-desc {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .card-footer {
      display: flex;
      align-items: center;
      font-weight: 600;
      font-size: 0.95rem;
      gap: 0.5rem;
      transition: gap 0.2s ease;
    }

    .article .card-footer {
      color: var(--accent-article);
    }

    .dialog .card-footer {
      color: var(--accent-dialog);
    }

    .nav-card:hover .card-footer {
      gap: 0.8rem;
    }

    .arrow {
      font-size: 1.2rem;
      line-height: 1;
    }

    footer {
      margin-top: 4rem;
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="badge">ENGLISH LEARNING HUB</span>
      <h1>英语学习中心</h1>
      <p>选择学习模块，开启你的英语学习之旅</p>
    </header>

    <main class="nav-grid">
      <a href="artical/index.html" class="nav-card article">
        <div>
          <div class="card-icon">✦</div>
          <div class="card-subtitle">Little Chapters</div>
          <h2 class="card-title">文章学习</h2>
          <p class="card-desc">精选英语短文与章节，支持目录索引、搜索筛选与字号调节，提升日常阅读与词汇积淀。</p>
        </div>
        <div class="card-footer">
          <span>进入文章页面</span>
          <span class="arrow">→</span>
        </div>
      </a>

      <a href="dialog/index.html" class="nav-card dialog">
        <div>
          <div class="card-icon">💬</div>
          <div class="card-subtitle">SceneSpeak</div>
          <h2 class="card-title">情景对话</h2>
          <p class="card-desc">真实生活与工作对话场景，提供口语朗读、实时生词库、发音播放与译文切换。</p>
        </div>
        <div class="card-footer">
          <span>进入对话页面</span>
          <span class="arrow">→</span>
        </div>
      </a>
    </main>

    <footer>
      <p>English Learning · One step every day</p>
    </footer>
  </div>
</body>
</html>
